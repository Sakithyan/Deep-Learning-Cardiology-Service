<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ECG Classification</title>
  <style>
    body {
      font-family: "Aptos", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      background: #eceff3;
      color: #1a2433;
    }
    .wrap {
      max-width: 960px;
      margin: 24px auto;
      padding: 0 16px;
    }
    .card {
      background: #ffffff;
      border: 1px solid #cad2de;
      border-radius: 0;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.04);
    }
    h1, h2 {
      margin-top: 0;
      letter-spacing: 0.2px;
      font-weight: 700;
    }
    .row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }
    select, input[type=file], button {
      padding: 8px 10px;
      border-radius: 0;
      border: 1px solid #b7c2d0;
      background: #fff;
      font-family: inherit;
      font-size: 14px;
    }
    button {
      border: 1px solid #1f5ac7;
      background: #1f5ac7;
      color: #fff;
      cursor: pointer;
      font-weight: 600;
    }
    button.secondary {
      background: #0c7a58;
      border-color: #0c7a58;
    }
    pre {
      white-space: pre-wrap;
      word-break: break-word;
      background: #f7f9fc;
      border: 1px solid #d7deea;
      border-radius: 0;
      padding: 12px;
    }
    .err { color: #b91c1c; font-weight: 600; }
    .ok { color: #166534; font-weight: 600; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>ECG Classification</h1>
  </div>

  <div class="card">
    <h2>Classify (1 modèle)</h2>
    <form method="post" action="/classify" enctype="multipart/form-data">
      <div class="row">
        <label for="model">Modèle</label>
        <select id="model" name="model">
          <option th:each="m : ${modelOptions}" th:value="${m}" th:text="${m}" th:selected="${m == selectedModel}"></option>
        </select>
        <input type="file" name="signalFile" accept=".txt" required />
        <button type="submit">Classify</button>
      </div>
    </form>
  </div>

  <div class="card">
    <h2>Classify-all</h2>
    <form method="post" action="/classify-all" enctype="multipart/form-data">
      <div class="row">
        <input type="file" name="signalFile" accept=".txt" required />
        <button class="secondary" type="submit">Classify-all</button>
      </div>
    </form>
  </div>

  <div class="card" th:if="${statusCode != null}">
    <p class="ok">Status: <span th:text="${statusCode}"></span></p>
  </div>

  <div class="card" th:if="${error != null}">
    <p class="err" th:text="${error}"></p>
  </div>

  <div class="card" th:if="${singleResult != null}">
    <h2>Résultat single</h2>
    <pre th:text="${singleResult}"></pre>
  </div>

  <div class="card" th:if="${allResult != null}">
    <h2>Résultat all</h2>
    <pre th:text="${allResult}"></pre>
  </div>
</div>
</body>
</html>
